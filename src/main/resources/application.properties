# ===================== 应用基本信息 =====================
spring.application.name=hiya-server
# 服务端口：浏览器访问 http://localhost:8080
server.port=8080

# ===================== 数据源（MySQL） =====================
# jdbc:mysql://主机:端口/数据库名?参数
#   useSSL=false              本机开发不需要 SSL 加密连接
#   serverTimezone=Asia/Shanghai  指定时区，避免时间差 8 小时
#   useServerPrepStmts=true   使用服务器端预编译语句，性能更好
spring.datasource.url=jdbc:mysql://localhost:3306/hiya_db?useSSL=false&serverTimezone=Asia/Shanghai&useServerPrepStmts=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
# 在控制台打印实际执行的 SQL（学习神器：可以看到框架帮你生成了什么 SQL）
spring.jpa.show-sql=true
# 格式化打印的 SQL，控制台输出更易读
spring.jpa.properties.hibernate.format_sql=true
# 表结构策略：none = 不自动改表（推荐生产做法！）
#   为什么不用 update？Hibernate 的 update 会【修改已有列】来匹配实体定义。
#   实测它把旧库的 TEXT 改成了 varchar(255)（长消息会被截断！）、
#   varchar(32) 改成了 varchar(255) 等，破坏旧表结构。
#   本项目沿用旧库 hiya_db（见 docs/03-数据库初始化.sql），实体类型与表结构兼容，
#   所以关闭自动改表；新环境建库请先执行 docs/03-数据库初始化.sql。
spring.jpa.hibernate.ddl-auto=none

# ===================== 身份标识（简化设计，无认证） =====================
# 已按需求取消 JWT 认证环节，改为前端传递用户标识：
#   REST 请求：请求头带 X-User-Id: {userId}
#   WebSocket：ws://localhost:8080/ws?userId={userId}
# 服务器只做"标识"不做"校验"（见 com.hiya.identity 包）——
# 所以这里不再需要任何密钥/有效期配置。
# 将来若要恢复认证：重新引入 jjwt 依赖 + 恢复 JwtUtil/JwtAuthInterceptor 即可。
